[project]
name = "herdr-bridge"
version = "0.1.0"
description = "WebSocket bridge between a local herdr server and the Herdr Android app"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Vladimir Vasilev" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.4",
    "psutil>=7.2.2",
    "qrcode>=8.2",
]

[project.scripts]
herdr-bridge = "herdr_bridge:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "RUF"]
ignore = ["RUF001", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/herdr_bridge/autostart.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]